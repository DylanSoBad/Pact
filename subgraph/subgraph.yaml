specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: PactProtocol
    network: arc-testnet
    source:
      address: "0x3600000000000000000000000000000000000000"
      abi: PactProtocol
      startBlock: 1
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Pact
        - User
        - ProtocolStat
        - PactEvent
      abis:
        - name: PactProtocol
          file: ./abis/PactProtocol.json
      eventHandlers:
        - event: PactCreated(indexed uint256,uint8,indexed address,indexed address,address,address,uint64,uint64,uint64,bytes32,bool)
          handler: handlePactCreated
        - event: PactFunded(indexed uint256,indexed address,address,uint64)
          handler: handlePactFunded
        - event: ProofSubmitted(indexed uint256,indexed address,bytes32)
          handler: handleProofSubmitted
        - event: ProofRejected(indexed uint256,indexed address)
          handler: handleProofRejected
        - event: PactCleared(indexed uint256,indexed address)
          handler: handlePactCleared
        - event: PactSlashed(indexed uint256,indexed address)
          handler: handlePactSlashed
        - event: PactExpired(indexed uint256)
          handler: handlePactExpired
        - event: PactCancelled(indexed uint256)
          handler: handlePactCancelled
      file: ./src/mapping.ts

name: ci

on:
  pull_request:
  push:
    branches: [main, codex/**]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge fmt --check src test script
      - run: forge build --sizes
      - run: forge test -vvv
      - uses: crytic/slither-action@v0.4.1
        with:
          target: contracts
          fail-on: high

  arc-fork:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      ARC_TESTNET_RPC_URL: ${{ secrets.ARC_TESTNET_RPC_URL }}
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Require fork RPC secret
        run: test -n "$ARC_TESTNET_RPC_URL"
      - run: forge test --match-contract PactArcForkTest -vvv

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_WC_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_PACT_ADDRESS_5042002: 0x5DC1fb739AFe3A7FA197d75C6A1ED1F72E852813
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
